name: Validate portal

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: JavaScript syntax
        run: node --check app.js
      - name: Required static files
        run: |
          test -s index.html
          test -s styles.css
          test -s app.js
          test -s README.md
      - name: Product contract smoke checks
        run: |
          grep -q 'Todo está al día' app.js
          grep -q 'Oportunidades' app.js
          grep -q 'Documentos' app.js
          grep -q 'Perfil' app.js
          grep -q 'localStorage' app.js
          grep -q '@media(max-width:850px)' styles.css
