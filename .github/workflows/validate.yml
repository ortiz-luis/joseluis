name: Validate portal

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: JavaScript syntax
        run: node --check app.js
      - name: Required static files
        run: |
          test -s index.html
          test -s styles.css
          test -s app.js
          test -s README.md
      - name: App contract smoke checks
        run: |
          grep -q 'Todo al día' app.js
          grep -q 'Procesos' app.js
          grep -q 'Documentos' app.js
          grep -q 'Oportunidades' app.js
          grep -q 'Perfil' app.js
          grep -q 'Por resolver' app.js
          grep -q 'localStorage' app.js
          grep -q 'metric-card' styles.css
          grep -q '@media(max-width:820px)' styles.css
      - name: Low-attention home guardrails
        run: |
          ! grep -q 'Actividad reciente' app.js
          ! grep -q 'No necesitas acordarte de todo' app.js
