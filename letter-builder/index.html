<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Crear carta · Postulaciones Joseluis</title><link rel="stylesheet" href="styles.css?v=1"></head><body><header><a href="../#documents">‹ Documentos</a><strong>Crear carta</strong><span>Sin cuenta · guardado local</span></header><main><section class="editor"><h1>Carta de motivación</h1><p>Importa la base privada de Joseluis o empieza desde cero. Todo queda en este navegador.</p><label class="import">Importar base privada<input id="import" type="file" accept="application/json" hidden></label><div class="row"><label>Idioma<select id="lang"><option value="es">Español</option><option value="fr">Français</option></select></label><label>Fecha<input id="date"></label></div><label>Destinatario<input id="recipient"></label><label>Dirección del destinatario<textarea id="address" rows="3"></textarea></label><label>Asunto<input id="subject"></label><label>Saludo<input id="opening"></label><label>Cuerpo<textarea id="body" rows="16"></textarea></label><label>Cierre<input id="closing"></label><div class="actions"><button id="tex">Descargar .tex</button><button id="pdf">Guardar PDF</button></div></section><aside><div class="small">Vista previa</div><article id="preview"></article></aside></main><script src="app.js?v=1"></script></body></html>
