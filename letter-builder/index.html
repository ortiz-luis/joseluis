<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Crear carta · Postulaciones Joseluis</title><link rel="stylesheet" href="styles.css?v=6"></head><body><header><a href="../#documents">‹ Documentos</a><strong>Crear carta</strong><span>Sin cuenta · guardado local</span></header><main><section class="editor"><h1>Carta de motivación</h1><p>La carta ya viene prellenada con una base de Joseluis. Adáptala a cada candidatura; todo queda guardado en este navegador.</p><label class="import">Importar base privada<input id="import" type="file" accept="application/json" hidden></label><details open><summary>Remitente</summary><div class="row"><label>Nombre<input id="sender-name"></label><label>Título<input id="sender-subtitle"></label></div><label>Dirección<textarea id="sender-address" rows="2"></textarea></label><div class="row"><label>Teléfono<input id="sender-phone"></label><label>Email<input id="sender-email"></label></div><label>Línea adicional de firma<input id="sender-note" placeholder="Opcional"></label></details><div class="row"><label>Idioma<select id="lang"><option value="es">Español</option><option value="fr">Français</option></select></label><label>Fecha<input id="date"></label></div><label>Destinatario<input id="recipient"></label><label>Dirección del destinatario<textarea id="address" rows="3"></textarea></label><label>Asunto<input id="subject"></label><label>Saludo<input id="opening"></label><label>Cuerpo<textarea id="body" rows="16"></textarea></label><label>Cierre<input id="closing"></label><div class="actions"><button id="tex">Descargar .tex</button><button id="pdf">Guardar PDF</button></div></section><aside><div class="small">Vista previa</div><article id="preview"></article></aside></main><script src="app.js?v=5"></script></body></html>
